services:
  mysql:
    image: mysql:8.0
    container_name: shikkha-bridge-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
    
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - shikkha-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shikkha-bridge-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5001}:5000"
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      AI_SERVICE_URL: http://ai-service:8000
      SERVER_PORT: 5000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shikkha-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: shikkha-bridge-ai
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_SERVICE_PORT: 8000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shikkha-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shikkha-bridge-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      - server
    networks:
      - shikkha-network

volumes:
  mysql-data:
    driver: local

networks:
  shikkha-network:
    driver: bridge
